name: Publish Python Package to PyPI

on:
  push:
    tags:
      - 'v*' # 當推送以 v 開頭的標籤（例如 v1.1.4）時觸發

jobs:
  build:
    name: 打包套件
    runs-on: ubuntu-latest

    steps:
      - name: 檢出原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整拉取 Git 歷史與 Tags，供 setuptools-scm 自動解析版本號

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安裝打包工具
        run: python -m pip install build --user

      - name: 構建二進位 Wheel 與原始碼壓縮包
        run: python -m build

      - name: 暫存打包成果
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: 發布至 PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # PyPI Trusted Publisher (OIDC) 權限

    steps:
      - name: 下載打包成果
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: 上傳套件至 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1